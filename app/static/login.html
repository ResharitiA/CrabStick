<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход — Анализатор рисков</title>
  <style>
    :root { color-scheme: light; --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --muted:#52514e; --line:#e1e0d9; --accent:#2a78d6; --critical:#d03b3b; }
    @media (prefers-color-scheme:dark) { :root { color-scheme:dark; --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --muted:#c3c2b7; --line:#383835; --accent:#3987e5; --critical:#e66767; } }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--page); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif }
    main { width:min(420px,100%); padding:32px; border:1px solid var(--line); border-radius:16px; background:var(--surface); box-shadow:0 18px 50px rgba(0,0,0,.08) }
    h1 { margin:0 0 8px; font-size:26px }
    p { margin:0 0 24px; color:var(--muted) }
    label { display:block; margin:16px 0 6px; font-weight:650 }
    input { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); font:inherit }
    input:focus { outline:3px solid color-mix(in srgb,var(--accent) 25%,transparent); border-color:var(--accent) }
    button { width:100%; min-height:44px; margin-top:22px; border:0; border-radius:9px; background:var(--accent); color:white; font:700 15px inherit; cursor:pointer }
    button:disabled { opacity:.6; cursor:wait }
    #error { min-height:24px; margin:12px 0 0; color:var(--critical); font-size:14px }
  </style>
</head>
<body>
  <main>
    <h1>Анализатор рисков</h1>
    <p>Войдите, чтобы открыть клиентскую аналитику.</p>
    <form id="form">
      <label for="username">Логин</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Войти</button>
      <div id="error" role="alert"></div>
    </form>
  </main>
  <script>
    const form = document.querySelector("#form");
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const button = form.querySelector("button");
      const error = document.querySelector("#error");
      button.disabled = true;
      error.textContent = "";
      try {
        const response = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value
          })
        });
        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          if (response.status === 401) throw new Error("Неверный логин или пароль");
          throw new Error(body.detail || `Сервер вернул ошибку ${response.status}`);
        }
        location.href = "/";
      } catch (exception) {
        error.textContent = exception instanceof TypeError
          ? "Нет соединения с сервером. Запустите приложение и откройте http://localhost:8000."
          : exception.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
